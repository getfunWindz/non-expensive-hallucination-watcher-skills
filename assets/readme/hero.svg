<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" role="img" aria-label="Hallucination Watch — 6-signal hallucination risk screening for LLM conversations. Signal board shows a high-risk reply scored MARK at 100%.">
  <title>Hallucination Watch — 6-signal hallucination risk screening</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="#22d3ee" opacity="0.8"/>

  <!-- 左侧：标题区 -->
  <text x="64" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#22d3ee" letter-spacing="4">LLM SAFETY TOOL · MCP SERVER</text>
  <text x="60" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#f1f5f9">Hallucination Watch</text>
  <text x="62" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" fill="#94a3b8">幻觉监测 · 6 信号 + EMA 自适应，按会话隔离</text>
  <text x="62" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" fill="#64748b">Every reply screened across 6 behavioral proxy signals.</text>

  <!-- 元数据行 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64748b">
    <rect x="60" y="292" width="430" height="56" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="78" y="316" fill="#7dd3fc">MCP tools: hw_init · hw_check · hw_status · hw_reset</text>
    <text x="78" y="338" fill="#94a3b8">55 tests · jieba zh · atomic writes · MIT</text>
  </g>

  <!-- 右侧：信号板 -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="600" y="64" font-size="20" fill="#22d3ee" letter-spacing="3">SIGNAL BOARD · 高危回复实测</text>

    <!-- 6 信号条（数值来自真实诊断场景） -->
    <g font-size="18">
      <text x="600" y="104" fill="#94a3b8">keyword density</text>
      <rect x="800" y="92" width="340" height="14" rx="7" fill="#1e293b"/>
      <rect x="800" y="92" width="306" height="14" rx="7" fill="url(#bar)"/>
      <text x="1152" y="104" fill="#f1f5f9" text-anchor="end">2.93</text>

      <text x="600" y="144" fill="#94a3b8">consistency</text>
      <rect x="800" y="132" width="340" height="14" rx="7" fill="#1e293b"/>
      <rect x="800" y="132" width="60" height="14" rx="7" fill="#fbbf24"/>
      <text x="1152" y="144" fill="#f1f5f9" text-anchor="end">0.70</text>

      <text x="600" y="184" fill="#94a3b8">fuzzy match</text>
      <rect x="800" y="172" width="340" height="14" rx="7" fill="#1e293b"/>
      <text x="1152" y="184" fill="#f1f5f9" text-anchor="end">0.00</text>

      <text x="600" y="224" fill="#94a3b8">material</text>
      <rect x="800" y="212" width="340" height="14" rx="7" fill="#1e293b"/>
      <text x="1152" y="224" fill="#f1f5f9" text-anchor="end">0.00</text>

      <text x="600" y="264" fill="#94a3b8">redundancy</text>
      <rect x="800" y="252" width="340" height="14" rx="7" fill="#1e293b"/>
      <text x="1152" y="264" fill="#f1f5f9" text-anchor="end">0.00</text>

      <text x="600" y="304" fill="#94a3b8">habit anomaly</text>
      <rect x="800" y="292" width="340" height="14" rx="7" fill="#1e293b"/>
      <rect x="800" y="292" width="10" height="14" rx="7" fill="#22d3ee"/>
      <text x="1152" y="304" fill="#f1f5f9" text-anchor="end">0.03</text>
    </g>

    <!-- Zone 指示器 -->
    <g font-size="18">
      <rect x="600" y="336" width="104" height="36" rx="8" fill="#334155" stroke="#475569"/>
      <text x="652" y="360" fill="#94a3b8" text-anchor="middle">SAFE</text>
      <rect x="716" y="336" width="110" height="36" rx="8" fill="#b45309" stroke="#f59e0b"/>
      <text x="771" y="360" fill="#fbbf24" text-anchor="middle" font-weight="700">MARK ▸</text>
      <rect x="838" y="336" width="116" height="36" rx="8" fill="#334155" stroke="#475569"/>
      <text x="896" y="360" fill="#94a3b8" text-anchor="middle">VERIFY</text>
    </g>
    <text x="600" y="404" font-size="17" fill="#64748b">硬触发：2+ red-flag phrases → MARK，不依赖密度（长文本不稀释）</text>
    <text x="600" y="428" font-size="17" fill="#64748b">实测区分度：高危 100% MARK vs 正常 2% SAFE</text>
  </g>
</svg>
